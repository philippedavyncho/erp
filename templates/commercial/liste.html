{% extends 'base.html' %}
{% block content %}<div class="d-flex justify-content-between"><h1 class="h2">Devis</h1><a class="btn btn-primary" href="{% url 'commercial:creer' %}">Nouveau devis</a></div><div class="card card-body mt-3"><table class="table"><tr><th>Référence</th><th>Client</th><th>Statut</th><th>Total TTC</th><th></th></tr>{% for item in items %}<tr><td>{{ item.reference }}</td><td>{{ item.client }}</td><td>{{ item.get_statut_display }}</td><td>{{ item.total_ttc|floatformat:0 }} FCFA</td><td><a href="{% url 'commercial:detail' item.pk %}">Voir</a></td></tr>{% endfor %}</table></div>{% endblock %}
