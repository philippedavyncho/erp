{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1>Panneaux</h1><a class="btn btn-primary" href="nouveau/">Ajouter</a></div><table class="table"><thead><tr><th>Référence</th><th>Dimensions</th><th>Surface</th><th>Statut</th></tr></thead><tbody>{% for x in items %}<tr><td>{{x.reference}}</td><td>{{x.longueur}} × {{x.largeur}} mm</td><td>{{x.surface}} m²</td><td>{{x.get_statut_display}}</td></tr>{% empty %}<tr><td colspan="4">Aucun panneau</td></tr>{% endfor %}</tbody></table>{% endblock %}
