{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between"><h1 class="h2">Clients</h1>{% if perms.clients.manage_client %}<a class="btn btn-primary" href="{% url 'clients:creer' %}">Nouveau client</a>{% endif %}</div><form class="my-3"><input class="form-control" name="q" value="{{ q }}" placeholder="Rechercher un client"></form><div class="card card-body"><table class="table"><tr><th>Référence</th><th>Client</th><th>Ville</th><th></th></tr>{% for item in items %}<tr><td>{{ item.reference }}</td><td>{{ item.nom }}</td><td>{{ item.ville }}</td><td><a href="{% url 'clients:detail' item.pk %}">Voir</a></td></tr>{% endfor %}</table></div>{% endblock %}
